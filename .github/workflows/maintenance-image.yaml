name: "CI - Workbench Maintenance"
on:
  pull_request:
    paths:
      - 'startupscript/maintenance/**'
      - 'startupscript/butane/**'
      - 'scripts/test/maintenance*.bats'
      - 'scripts/test/fixtures/maintenance-*/**'
      - 'scripts/test/integration/maintenance-*.bats'
      - '.github/workflows/maintenance-image.yaml'
  push:
    branches: [master]
    paths:
      - 'startupscript/maintenance/**'
      - 'startupscript/butane/**'
      - 'scripts/test/maintenance*.bats'
      - 'scripts/test/fixtures/maintenance-*/**'
      - 'scripts/test/integration/maintenance-*.bats'
      - '.github/workflows/maintenance-image.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq shellcheck
      - name: Check maintenance scripts
        run: |
          find startupscript/maintenance -name '*.sh' -print0 | xargs -0 shellcheck -e SC1090 -e SC1091
          bats scripts/test/maintenance*.bats
          bats scripts/test/fixtures/maintenance-vm/scenarios.bats
          bats scripts/test/integration/maintenance-*.bats

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build twice from the same public source commit
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(date -u +%Y%m%d%H%M%S)"
          startupscript/maintenance/build/build-image.sh "$version" "$RUNNER_TEMP/image-one" "$SOURCE_COMMIT"
          startupscript/maintenance/build/build-image.sh "$version" "$RUNNER_TEMP/image-two" "$SOURCE_COMMIT"
          cmp "$RUNNER_TEMP/image-one/SHA256SUMS" "$RUNNER_TEMP/image-two/SHA256SUMS"
          cmp "$RUNNER_TEMP/image-one/payload.sha256" "$RUNNER_TEMP/image-two/payload.sha256"
      - name: Check the assembled payload
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          image="$(find "$RUNNER_TEMP/image-one" -name '*.raw' -print -quit)"
          unsquashfs -d "$RUNNER_TEMP/extracted" "$image"
          (cd "$RUNNER_TEMP/extracted" && sha256sum --check "$RUNNER_TEMP/image-one/payload.sha256")
          ln -s "$RUNNER_TEMP/extracted/usr/lib/workbench/butane/jsoncStripComments.mjs" "$RUNNER_TEMP/parser.mjs"
          printf '{/* public fixture */"value":1}' | node "$RUNNER_TEMP/parser.mjs" | jq -e '.value == 1'
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-maintenance-image
          path: ${{ runner.temp }}/image-one/
          retention-days: 3
