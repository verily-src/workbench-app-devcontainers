name: "CI - Test OpenCode Nemotron MCP scripts"
on:
  pull_request:
    paths:
      - 'src/opencode-nemotron-mcp/**'
      - 'tests/opencode-nemotron-mcp/**'
      - 'features/src/wb-mcp-server/**'
      - 'features/src/llm-context/**'
      - 'features/src/workbench-tools/**'
      - '.github/workflows/test-opencode-nemotron-mcp.yaml'
  push:
    branches: [master]
    paths:
      - 'src/opencode-nemotron-mcp/**'
      - 'tests/opencode-nemotron-mcp/**'
      - 'features/src/wb-mcp-server/**'
      - 'features/src/llm-context/**'
      - 'features/src/workbench-tools/**'
      - '.github/workflows/test-opencode-nemotron-mcp.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: shellcheck src/opencode-nemotron-mcp/*.sh tests/opencode-nemotron-mcp/*.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: features/src/wb-mcp-server/go.mod
          cache: false
      - name: Build the shared MCP server for transport tests
        run: go build -o "$RUNNER_TEMP/wb-mcp-server" features/src/wb-mcp-server/main.go
      - name: Test without GPU or model downloads
        env:
          WB_MCP_TEST_BINARY: ${{ runner.temp }}/wb-mcp-server
        run: python3 -m unittest discover -s tests/opencode-nemotron-mcp -v

  container:
    name: Build devcontainer and test installed OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned devcontainer CLI
        run: npm install -g @devcontainers/cli@0.89.0
      - name: Build all features and exercise model switching without GPU
        run: |
          set -o pipefail
          bash tests/opencode-nemotron-mcp/build-container.sh 2>&1 | tee "$RUNNER_TEMP/opencode-container-build.log"
      - name: Include build failure details in the check summary
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "opencode-container-build.log"
          if log.exists():
              tail = log.read_text(errors="replace")[-12000:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Container build or integration failure::" + escaped)
          PY
