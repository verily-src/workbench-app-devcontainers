name: "CI - Test Scripts"
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'startupscript/**'
      - 'src/virtual-browser-*/**'
      - 'tests/test-codeartifact.bats'
      - 'startupscript/butane/050-parse-devcontainer.sh'
      - 'startupscript/butane/update-flatcar.sh'
      - 'tests/update-flatcar.bats'
      - '.github/workflows/test-scripts.yaml'
  push:
    branches:
      - master
    paths:
      - 'scripts/**'
      - 'startupscript/**'
      - 'src/virtual-browser-*/**'
      - 'tests/test-codeartifact.bats'
      - 'startupscript/butane/050-parse-devcontainer.sh'
      - 'startupscript/butane/update-flatcar.sh'
      - 'tests/update-flatcar.bats'
      - '.github/workflows/test-scripts.yaml'

jobs:
  test-create-custom-app:
    name: "Test scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install startup script dependencies
        run: npm ci --prefix startupscript/butane

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run bats tests
        run: |
          cd scripts/test
          bats .

      - name: Test offline recreation with Docker
        run: |
          docker pull python:3.12-alpine
          docker build -t workbench-parser-test -f scripts/test/integration/parse-devcontainer.Dockerfile scripts/test/integration
          bats scripts/test/integration

      - name: Run update-flatcar tests
        run: bats tests/update-flatcar.bats

  test-codeartifact:
    name: "Test CodeArtifact authentication and refresh"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run CodeArtifact tests
        run: bats tests/test-codeartifact.bats
