name: "CI - Test Scripts"
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'startupscript/**'
      - 'src/virtual-browser-*/**'
      - 'tests/test-codeartifact.bats'
      - 'startupscript/butane/050-parse-devcontainer.sh'
      - 'startupscript/butane/update-flatcar.sh'
      - 'tests/update-flatcar.bats'
      - '.github/workflows/test-scripts.yaml'
  push:
    branches:
      - master
    paths:
      - 'scripts/**'
      - 'startupscript/**'
      - 'src/virtual-browser-*/**'
      - 'tests/test-codeartifact.bats'
      - 'startupscript/butane/050-parse-devcontainer.sh'
      - 'startupscript/butane/update-flatcar.sh'
      - 'tests/update-flatcar.bats'
      - '.github/workflows/test-scripts.yaml'

jobs:
  test-create-custom-app:
    name: "Test scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install startup script dependencies
        run: npm ci --prefix startupscript/butane

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      # Keep in sync with the sysexts in verily1 workbench/app-manager/static/butane/butane.yaml.tmpl.
      - name: Install the Docker Compose and Buildx versions VMs use
        run: |
          plugins="${HOME}/.docker/cli-plugins"
          mkdir -p "${plugins}"
          curl -fsSL -o "${plugins}/docker-compose" https://github.com/docker/compose/releases/download/v2.39.3/docker-compose-linux-x86_64
          curl -fsSL -o "${plugins}/docker-buildx" https://github.com/docker/buildx/releases/download/v0.28.0/buildx-v0.28.0.linux-amd64
          echo "065836e21bce25674d2876dc64321ac707808fcd120e1c3ba700b0ce5ce8ff16  ${plugins}/docker-compose" | sha256sum -c
          echo "696bc104bac3bb708eff1af3f8bbc09fda0fd88f5757c1f9b404a35117889224  ${plugins}/docker-buildx" | sha256sum -c
          chmod +x "${plugins}/docker-compose" "${plugins}/docker-buildx"
          docker compose version
          docker buildx version

      - name: Run bats tests
        run: |
          cd scripts/test
          bats .

      - name: Test offline recreation with Docker
        run: |
          docker pull python:3.12-alpine
          docker build -t workbench-parser-test -f scripts/test/integration/parse-devcontainer.Dockerfile scripts/test/integration
          bats scripts/test/integration

      - name: Run update-flatcar tests
        run: bats tests/update-flatcar.bats

  test-codeartifact:
    name: "Test CodeArtifact authentication and refresh"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run CodeArtifact tests
        run: bats tests/test-codeartifact.bats
