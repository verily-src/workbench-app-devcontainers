name: "CI - Test wb-mcp-server"
on:
  pull_request:
    paths:
      - 'features/src/wb-mcp-server/**'
      - 'features/src/llm-context/**'
      - '.github/workflows/test-wb-mcp-server.yaml'
  push:
    branches:
      - master
    paths:
      - 'features/src/wb-mcp-server/**'
      - 'features/src/llm-context/**'
      - '.github/workflows/test-wb-mcp-server.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test wb-mcp-server"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: features/src/wb-mcp-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: features/src/wb-mcp-server/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
