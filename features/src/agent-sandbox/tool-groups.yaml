    - folder_update
    - aurora_resolve_connection
    - s3_write_file
    - s3_copy
    - git_execute
    - group_create
    - group_delete
    - group_list
    - group_describe
    - group_add_user
    - group_remove_user
    - pod_list
    - pod_describe
    - pod_role_list
    - pod_role_grant
    - pod_role_revoke
    - organization_list
    - server_list
    - server_set
    - server_list_regions
  legacy:
    - notebook_start
    - notebook_stop
    - notebook_launch
    - cluster_start
    - cluster_stop
    - cluster_launch
    - wb_workspace_list
    - folder_list_tree
    - server_status
