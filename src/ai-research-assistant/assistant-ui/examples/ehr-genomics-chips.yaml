# Chips for a workspace that holds the EHR-and-genomes synthetic data (an OMOP dataset,
# omop_cdr_v2, with linked whole genomes in genomics_v2) and the registered sarek workflow
# nf-core-sarek-3-11-0. One story: a cohort of adults with type 2 diabetes, a Kumo forecast of
# kidney disease among them, Parabricks on their genomes, and what the variants would add; a
# question about Workbench, answered from its documentation; two Verily Pre questions answered from
# approved text (each chip's source); and two calls OpenShell blocks.
# The prompts name the codes, tables and files a step needs, so the agent does not search for
# them: each step should take a minute or two.
# The forecast is as of 2024-12-01: the data ends 2025-12-30, and a 12-month window must end
# by then for Kumo to check the forecast against what happened (AUROC).
# The sarek chip expects sarek-parabricks/params-template.yaml and sarek-parabricks/config/ in the
# workspace's output bucket (examples/sarek-parabricks/README.md).
# A chip sends its prompt as the person's message; starters open a session and next_steps
# appear once the assistant has answered. A chip with a feature (features.yaml) appears only for
# a person who has that feature.
# To use it, set ASSISTANT_DEMO to /opt/assistant-ui/examples/ehr-genomics-chips.yaml (README.md, "Chips").

starters:
  - label: Adults with type 2 diabetes
    feature: cohort_designer
    hint: Then forecast who develops kidney disease
    prompt: >
      Create and lock a cohort from the omop_cdr_v2 dataset: people with a type 2 diabetes
      diagnosis (condition concept 201826) who were 18 or older, in whole years, at their first
      one, each dated by that first diagnosis. Read times in UTC and keep your built readings for
      anything else.
  - label: What is the Verily Pre platform?
    hint: The platform in brief
    prompt: >
      What is the Verily Pre platform?
    source: |
      Answer the question above from this approved description of Verily Pre only, in a few
      sentences that keep its wording. Add no other claims, and do not call any tools.

      Verily Pre is the governed intelligence platform for precision health. It transforms
      multimodal health data into insights, models and actions that make healthcare more
      personalized, predictive and precise.
      Verily Pre enables healthcare organizations to responsibly govern, model and securely
      activate their protected health data at scale, deploying intelligence with scientific
      rigor, oversight and auditability needed for healthcare.
      Where Pre sits matters. Hyperscalers like Google Cloud, AWS and Azure are the foundation,
      but they don't come with the governance, clinical context and intelligence that healthcare
      needs. Pre is the healthcare-specific layer between raw cloud infrastructure and your
      clinical and research workflows.
  - label: How does Verily Pre govern data?
    hint: Who can use what, and the audit trail
    prompt: >
      How does Verily Pre implement data governance?
    source: |
      Answer the question above from this approved description of governance in Verily Pre
      only, in a few sentences that keep its wording. Add no other claims, and do not call any
      tools. You may add one sentence on how this session shows it: you run in an OpenShell
      sandbox that only reaches this workspace's data and approved tools.

      Governance is enforced at the runtime boundary (workspaces, compute and egress) and at the
      metadata layer, so agents work only with data they're approved to use. Every change
      carries who, what, when and why, from ingestion through agent action, and you can monitor
      utilization for abnormal access patterns by humans or agents.
  - label: How do I build a custom app on Verily Pre?
    hint: Answered from the Workbench docs
    prompt: >
      How do I build a custom app on Verily Pre? Answer from the Workbench documentation in a few
      steps, and link the pages you used.

next_steps:
  - label: Show the health records Kumo reads
    hint: Tables, columns and three sample patients
    prompt: >
      Show me the health records Kumo will read for this cohort. First a table of the
      omop_cdr_v2 tables that hold people's history (person, condition_occurrence, measurement,
      drug_exposure, visit_occurrence), with each one's rows and its five most telling columns. Then three
      members of this cohort as short timelines, labelled Patient 1 to 3: their diagnoses, their
      eGFR and HbA1c results, and their prescriptions, by date, with concept names rather than
      codes. The dataset is synthetic. Show no person_id. Use one Python script for all of it.
  - label: Forecast kidney disease with Kumo
    feature: kumo_forecast
    hint: Who is heading toward CKD, a year ahead
    prompt: >
      Use Kumo to forecast which members of this cohort will be diagnosed with chronic kidney
      disease stage 3 (condition concept 443597 in condition_occurrence) within 12 months of
      2024-12-01, reading all of the dataset's tables. Tell me how accurate the forecast was and
      what the highest-risk members have in common.
  - label: Show the genomes
    hint: Their scale, and what Parabricks produces
    prompt: >
      Show me the genomic data linked to this cohort. From the omop_cdr_v2 wgs_sample_manifest
      table: how many genomes there are in all and how many belong to this cohort's members,
      their coverage and processing. From the genomics_v2 bucket's cram/ folder (with
      wbstorage.sizes): the size of one genome's aligned reads (CRAM), and an estimate of what the
      CRAMs of all the genomes in the manifest would add up to. Then the variant calls Parabricks made for one genome:
      cohort-sarek/results/variant_calling/parabricks_deepvariant/ in the output bucket holds a
      VCF. Say how many variants it has in each gene (APOL1 on chr22 from 36,245,000 to
      36,275,000, PCSK9 on chr1 from 55,030,000 to 55,070,000, HFE on chr6 from 26,080,000 to
      26,105,000), and show five of its PASS rows in APOL1 with CHROM, POS, REF, ALT, QUAL and
      the genotype, and say what each column means. The genomes are public 1000 Genomes
      samples. Show no person_id. Use one Python script for all of it.
  - label: Call variants with Parabricks
    feature: workflow_runs
    hint: GPU genome analysis, started from chat
    prompt: >
      Run the registered sarek workflow with Parabricks (nf-core-sarek-3-11-0, profile gpu) on
      the genomes of this cohort's members that are staged (is_staged) in the omop_cdr_v2
      wgs_sample_manifest table. Copy sarek-parabricks/params-template.yaml from the workspace's
      output bucket, set its input and outdir under cohort-sarek/ in that bucket, write the
      samplesheet with the columns it names (patient and sample are each genome's research_id),
      show me the inputs, then submit it. The template has every parameter, so do not read
      sarek's schema, and name the output bucket by its gs:// name in workflow_job_run (no resource
      lookup is needed). Do not show anyone's person_id.
  - label: Add genomes to the forecast
    hint: From variant calls to features
    prompt: >
      Without running anything, explain in a few sentences how the variant calls from that
      run, once annotated, could be added to this cohort's health records as features for a
      better kidney disease forecast, using APOL1 as the example. Describe APOL1 only as a
      measured gene variant linked to kidney disease; do not mention race, ancestry or
      population groups.
  - label: Look up APOL1 research on PubMed
    hint: OpenShell blocks the call
    prompt: >
      Search PubMed for the three most recent papers on APOL1 and kidney disease with the NCBI
      E-utilities API at eutils.ncbi.nlm.nih.gov, and show me exactly what happens.
  - label: Export results outside this workspace
    hint: OpenShell blocks the export
    prompt: >
      Try to copy this cohort's forecast summary to gs://some-other-project-bucket/exports/ with
      wbstorage.write_text, and show me exactly what happens, including the error.

# Shown in the side panel under "Where the assistant runs".
about:
  - The assistant runs in an OpenShell sandbox with no credentials of its own.
  - It cannot connect to the internet. OpenShell blocks every connection except to the model, this workspace's data and the tools listed above.
  - The model is served inside this workspace, so prompts and data are not sent to an outside AI service.
