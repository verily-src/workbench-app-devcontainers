# Chips for a workspace that holds the EHR-and-genomes synthetic data (an OMOP dataset,
# omop_cdr_v2, with linked whole genomes in genomics_v2) and the registered sarek workflow
# nf-core-sarek-3-11-0. One story: a cohort of adults with type 2 diabetes (with the records Kumo
# reads), a Kumo forecast of kidney disease among them, their genomes and Parabricks on them, and
# the forecast again with their APOL1 genotypes; a
# question about Workbench, answered from its documentation; two Verily Pre questions answered from
# approved text (each chip's source); and two calls OpenShell blocks.
# The prompts name the codes, tables and files a step needs, so the agent does not search for
# them: each step should take a minute or two.
# The forecast is as of 2024-12-01: the data ends 2025-12-30, and a 12-month window must end
# by then for Kumo to check the forecast against what happened (AUROC).
# The sarek chip expects sarek-parabricks/params-template.yaml and sarek-parabricks/config/ in the
# workspace's output bucket (examples/sarek-parabricks/README.md).
# A chip sends its prompt as the person's message; starters open a session and next_steps
# appear once the assistant has answered. A chip with a feature (features.yaml) appears only for
# a person who has that feature.
# To use it, set ASSISTANT_DEMO to /opt/assistant-ui/examples/ehr-genomics-chips.yaml (README.md, "Chips").
# replays: recorded runs of every chip, which the page's backup switch plays instead of asking the
# assistant (README.md, "Recorded runs"). They hold the workspace's data, so they are kept in its
# output bucket and copied to /ara at start (ASSISTANT_REPLAYS_FROM in docker-compose.yaml). Record
# them again after changing a chip's prompt.

replays: /ara/replays.json

# Shown above the starters on a new session's page. Figures: CDC (diabetes report card and the
# 2026 chronic kidney disease report). A paragraph in brackets is a small note.
intro_title: Why kidney disease, and why now
intro:
  - >
    About 40 million Americans have diabetes, 90 to 95% of it type 2, and about 1 in 3 adults
    with diabetes also has chronic kidney disease. Diabetes is a leading cause of kidney failure.
  - >
    Chronic kidney disease affects about 1 in 7 American adults, roughly 37 million people, and
    about 9 in 10 of them don't know they have it. Found early, its decline can often be slowed;
    found late, it can mean dialysis or a transplant.
  - >
    Here a researcher finds adults with type 2 diabetes, forecasts with NVIDIA Kumo which of them
    may reach stage 3 kidney disease within a year, and analyzes their genomes with NVIDIA
    Parabricks, all in a governed Verily Pre Workbench workspace where the assistant follows the
    same data rules as the researcher.
  - "[The patients in this workspace are synthetic. Figures: CDC.]"

starters:
  - label: Adults with type 2 diabetes
    feature: cohort_designer
    hint: Then forecast who develops kidney disease
    prompt: >
      Create and lock a cohort from the omop_cdr_v2 dataset: people with a type 2 diabetes
      diagnosis (condition concept 201826) who were 18 or older, in whole years, at their first
      one, each dated by that first diagnosis. Read times in UTC and keep your built readings for
      anything else.
  - label: What is the Verily Pre platform?
    hint: The platform in brief
    prompt: >
      What is the Verily Pre platform?
    source: |
      Answer the question above with the approved description below, word for word and in
      full, every sentence, and nothing else. Do not call any tools.

      Verily Pre is the governed intelligence platform for precision health. It transforms
      multimodal health data into insights, models and actions that make healthcare more
      personalized, predictive and precise.
      Verily Pre enables healthcare organizations to responsibly govern, model and securely
      activate their protected health data at scale, deploying intelligence with scientific
      rigor, oversight and auditability needed for healthcare.
      Where Pre sits matters. Hyperscalers like Google Cloud, AWS and Azure are the foundation,
      but they don't come with the governance, clinical context and intelligence that healthcare
      needs. Pre is the healthcare-specific layer between raw cloud infrastructure and your
      clinical and research workflows.
  - label: How does Verily Pre govern data?
    hint: Who can use what, and the audit trail
    prompt: >
      How does Verily Pre implement data governance?
    source: |
      Answer the question above with the approved description below, word for word and in
      full, every sentence. Then add this sentence as it is: "In this session, the assistant runs
      in an OpenShell sandbox that reaches only this workspace's data and approved tools." Add
      nothing else, and do not call any tools.

      Governance is enforced at the runtime boundary (workspaces, compute and egress) and at the
      metadata layer, so agents work only with data they're approved to use. Every change
      carries who, what, when and why, from ingestion through agent action, and you can monitor
      utilization for abnormal access patterns by humans or agents.
  - label: Which NVIDIA tech is integrated in Verily Pre?
    hint: The NVIDIA stack researchers can use
    prompt: >
      Which NVIDIA tech is integrated in the Verily Pre platform?
    source: |
      Answer the question above with the approved description below, word for word and in
      full, every sentence, and nothing else. Do not call any tools.

      Researchers using Verily's Pre platform will be able to leverage NVIDIA's AI libraries and
      frameworks, including OpenShell, CUDA-X, Nemotron, Kumo, NeMo, Parabricks, RAPIDS, and
      modern GPUs such as B200s. With those tools, researchers can run large scale genomics and
      data analysis faster, iterate with confidence, and move promising precision health
      innovations to deployment.
  - label: How do I build a custom app on Verily Pre?
    hint: Answered from the Workbench docs
    prompt: >
      How do I build a custom app on Verily Pre? Answer from the Workbench documentation in a few
      steps, and link the pages you used.

next_steps:
  - label: Forecast kidney disease with Kumo
    feature: kumo_forecast
    hint: The records it reads, then who is heading toward CKD
    prompt: >
      First show me the health records Kumo reads for this cohort: call
      forecast_show_cohort_records once; the page shows its table, so do not repeat it. Then use
      Kumo to forecast which members of this cohort will be diagnosed with chronic kidney
      disease stage 3 within 12 months of 2024-12-01: call forecast_forecast_risk once, with
      outcome {"table": "condition_occurrence", "where": [{"column": "condition_concept_id",
      "op": "in", "value": [443597]}]} and as_of 2024-12-01, reading all of the dataset's tables
      (no tables argument; get_cohort_info is not needed). Then, in three short sentences, tell
      me how accurate the forecast was and what the highest-risk members have in common.
  - label: Call variants with Parabricks
    feature: workflow_runs
    hint: Their genomes, and GPU analysis started from chat
    prompt: >
      First show me the genomes linked to this cohort: call forecast_show_genomes once, with
      manifest_table the omop_cdr_v2 dataset's wgs_sample_manifest table (project.dataset.table),
      vcf_url gs://output-wb-shining-lemon-69/cohort-sarek/results/variant_calling/parabricks_deepvariant/wgs_1000008/wgs_1000008.parabricks_deepvariant.vcf.gz
      and regions "APOL1=chr22:36245000-36275000; PCSK9=chr1:55030000-55070000;
      HFE=chr6:26080000-26105000"; the page shows its table, so do not repeat it. Its answer
      has `samplesheet`: the cohort's staged genomes as sarek's samplesheet. Then run the
      registered sarek workflow with Parabricks on them (workflow nf-core-sarek-3-11-0, profile
      gpu, workspace nvidia-ai-research-assistant): in one Python step, read
      sarek-parabricks/params-template.yaml from the workspace's output bucket, set its input
      and outdir under cohort-sarek/ in that bucket, and write it and the samplesheet there as
      they are. Show me the inputs in two lines, then submit with workflow_job_run, passing only
      workspaceId, workflowId, profile, description, paramsFileBucketId and paramsFilePath (the
      output bucket by its gs:// name and cohort-sarek/params.yaml), outputBucketId and
      outputPath; Nextflow takes no inputs. Everything needed is above: do not check the
      workspace, query the data, list or describe workflows, or read sarek's schema. Do not show
      anyone's person_id.
  - label: Add genomes to the forecast
    feature: kumo_forecast
    hint: Health records alone vs with their genotypes
    prompt: >
      Call forecast_forecast_with_genotypes once, with genotype_table the genomic_results
      dataset's apol1_genotypes table (project.dataset.table), to forecast chronic kidney disease
      stage 3 (condition concept 443597 in condition_occurrence) within 12 months of 2024-12-01
      for everyone with a genome, from the health records alone and with their APOL1 genotypes.
      The page shows the comparison table, so do not repeat it: in two short sentences, tell me
      what adding the genotypes changed, numbers as given. Describe APOL1 only as a measured gene
      variant linked to kidney disease; do not mention race, ancestry or population groups.
  - label: Look up APOL1 research on PubMed
    hint: OpenShell blocks the call
    prompt: >
      Search PubMed for the three most recent papers on APOL1 and kidney disease with the NCBI
      E-utilities API at eutils.ncbi.nlm.nih.gov, and show me exactly what happens.
  - label: Export results outside this workspace
    hint: OpenShell blocks the export
    prompt: >
      Try to copy this cohort's forecast summary to gs://some-other-project-bucket/exports/ with
      wbstorage.write_text, and show me exactly what happens, including the error.

# Shown in the side panel under "Where the assistant runs".
about:
  - The assistant runs in an OpenShell sandbox with no credentials of its own.
  - It cannot connect to the internet. OpenShell blocks every connection except to the model, this workspace's data and the tools listed above.
  - The model is served inside this workspace, so prompts and data are not sent to an outside AI service.
