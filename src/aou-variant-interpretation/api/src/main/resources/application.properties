spring.application.name=variant-interpretation-api
server.port=8080

# The BigQuery details for the VAT
bigquery.vat-project-id=${VAT_PROJECT_ID:aou-via-dev}
bigquery.vat-dataset-id=${VAT_DATASET_ID:foxtrot_synthetic}
bigquery.vat-table-id=${VAT_TABLE_ID:v3}

# The BigQuery details for the CDR in the Workspace
# Ultimately, this billing project and the one for the VAT
# will be the same but during development they are different.
bigquery.billing-project-id=${GOOGLE_PROJECT:aou-via-dev}
bigquery.cdr=${WORKSPACE_CDR:aou-via-dev.foxtrot_synthetic}
