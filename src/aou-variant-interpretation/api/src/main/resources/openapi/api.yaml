openapi: 3.0.3
info:
  title: Variant Interpretation Backend API
  description: API for the All of Us Variant Interpretation Application.
  version: 0.1.0
servers:
  - url: /
paths:
  /api/profile:
    get:
      operationId: profile
      summary: Returns details about the current user
      tags:
        - profile
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/search:
    get:
      operationId: searchResults
      summary: Returns the candidate variant search results
      tags:
        - search
      parameters:
        - name: variants
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Candidate variant IDs, VAT `vid` format (e.g. "8-11708582-C-T").
        - name: conditionConceptIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
          description: >-
            The condition concept IDs the user picked from /api/condition, one
            parameter per concept. A participant is matched by any of them (or
            a descendant of any of them), not all of them. There's deliberately
            no free-text alternative: re-searching typed text and choosing a
            match for the user could count a different concept than the one
            they meant. Duplicates are ignored; the UI sends up to three. When
            absent or empty, conditionSearch is null.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultsResponse"
  /api/condition:
    get:
      operationId: conditionCandidates
      summary: >-
        Returns condition concepts matching a free-text term
      description: >-
        This is used for a type-ahead when the user is entering a condition
        name. The results are ranked by estimated participant count, with
        concepts that have no estimate last.
      tags:
        - condition
      parameters:
        - name: condition
          in: query
          required: false
          schema:
            type: string
          description: >-
            Free-text condition name, e.g. "tetralogy of fallot".
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConditionCandidates"
  /api/sources:
    get:
      operationId: dataSourceVersions
      summary: >-
        Returns the version of each external dataset used to annotate and
        filter variants
      tags:
        - system
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceVersion"
  /api/usage:
    get:
      operationId: queryUsage
      summary: >-
        Reports the BigQuery usage this VIA instance has accumulated since it
        started
      description: >-
        Totals from BigQuery's own job statistics for every query VIA has run
        since the VIA session started.
      tags:
        - system
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryUsage"
  /api/status:
    get:
      operationId: bigQueryStatus
      summary: >-
        Reports whether the backend can read every BigQuery table it queries
        (the VAT table and the CDR's condition lookup tables) with its
        Application Default Credentials
      tags:
        - system
      responses:
        "200":
          description: >-
            The check ran. Note that a failed check is still a 200; see the
            `accessible` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BigQueryStatus"
components:
  schemas:
    BigQueryStatus:
      type: object
      required:
        - accessible
        - tables
      properties:
        accessible:
          type: boolean
          description: True when every table is accessible.
        tables:
          type: array
          description: Every table VIA queries, in the order they were checked.
          items:
            $ref: "#/components/schemas/TableStatus"
    QueryUsage:
      type: object
      required:
        - queries
        - cacheHits
        - bytesProcessed
        - bytesBilled
        - slotMilliseconds
        - estimatedCostUsd
        - since
        - searches
      properties:
        queries:
          type: integer
          description: Queries run since `since`, including ones answered from BigQuery's cache.
          example: 14
        cacheHits:
          type: integer
          description: Of those, how many BigQuery answered from its result cache, which bills nothing.
          example: 5
        bytesProcessed:
          type: integer
          format: int64
          description: Bytes BigQuery read across all queries.
          example: 2415919104
        bytesBilled:
          type: integer
          format: int64
          description: >-
            Bytes BigQuery billed, which is what on-demand pricing charges
            for: rounded up to the nearest MB with a minimum of 10 MB per
            table the query references, and zero for a cache hit.
          example: 2516582400
        slotMilliseconds:
          type: integer
          format: int64
          description: >-
            Slot time consumed, the measure that matters for a project billed
            by reservation rather than on demand.
          example: 48211
        estimatedCostUsd:
          type: number
          format: double
          description: >-
            bytesBilled at on-demand pricing (US$6.25 per TiB). An estimate:
            a project on a reservation is charged by slot time, not bytes.
          example: 0.0146
        since:
          type: string
          format: date-time
          description: When the backend started counting.
        searches:
          type: array
          description: >-
            The last 20 requests that queried BigQuery, newest first, each
            with the queries it ran: /api/search runs and the condition
            type-ahead's lookups. A request that ran no query (a blank term)
            isn't logged.
          items:
            $ref: "#/components/schemas/SearchUsage"
    SearchUsage:
      type: object
      description: One request that queried BigQuery, and the queries it made.
      required:
        - id
        - kind
        - at
        - variants
        - phenotypes
        - term
        - queries
        - cacheHits
        - bytesProcessed
        - bytesBilled
        - estimatedCostUsd
      properties:
        id:
          type: integer
          description: Counts up from 1 within the session.
        kind:
          type: string
          enum: [search, condition]
          description: A search (/api/search) or a condition lookup for the type-ahead (/api/condition).
        at:
          type: string
          format: date-time
          description: When the request started.
        variants:
          type: array
          description: For a search, the variant IDs searched, as sent. Empty for a condition lookup.
          items:
            type: string
        phenotypes:
          type: array
          description: >-
            For a search, the names of the conditions it resolved, in request
            order; a participant is matched by any of them. Empty when none was
            picked or found, and for a condition lookup.
          items:
            type: string
          example: ["Hypertrophic cardiomyopathy", "Long QT syndrome"]
        term:
          type: string
          nullable: true
          description: For a condition lookup, the text looked up. Null for a search.
          example: "long qt"
        queries:
          type: array
          description: The search's BigQuery jobs, in the order they ran.
          items:
            $ref: "#/components/schemas/QueryJob"
        cacheHits:
          type: integer
        bytesProcessed:
          type: integer
          format: int64
        bytesBilled:
          type: integer
          format: int64
        estimatedCostUsd:
          type: number
          format: double
          description: bytesBilled at on-demand pricing; see QueryUsage.estimatedCostUsd.
    QueryJob:
      type: object
      description: One BigQuery job, as the service names its query shapes.
      required:
        - name
        - at
        - cacheHit
        - bytesProcessed
        - bytesBilled
        - slotMilliseconds
      properties:
        name:
          type: string
          example: "Cohort count"
        at:
          type: string
          format: date-time
        cacheHit:
          type: boolean
          description: Answered from BigQuery's result cache, which bills nothing.
        bytesProcessed:
          type: integer
          format: int64
        bytesBilled:
          type: integer
          format: int64
        slotMilliseconds:
          type: integer
          format: int64
    TableStatus:
      type: object
      required:
        - table
        - accessible
      properties:
        table:
          type: string
          description: The table that was checked, as "project.dataset.table".
          example: "placeholder-project.placeholder_dataset.v1"
        accessible:
          type: boolean
          description: True when the table's metadata could be read.
        detail:
          type: string
          nullable: true
          description: Why the check failed. Null when accessible is true.
    UserProfile:
      type: object
      required:
        - userEmail
      properties:
        userEmail:
          type: string
          description: >-
            Email address of the Workbench user
          example: "researcher@example.org"
    DataSourceVersion:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          example: "gnomAD"
        version:
          type: string
          example: "v3.1.2"
        description:
          type: string
          nullable: true
          description: What VIA uses from the source.
          example: "Allele frequencies across the wider population, for comparison"
        url:
          type: string
          nullable: true
    SearchResultsResponse:
      type: object
      required:
        - searchSummary
        - ancestryBreakdown
        - ageBreakdown
        - cohortVariants
        - filteredVariants
        - conditionSearch
      properties:
        searchSummary:
          $ref: "#/components/schemas/SearchSummary"
        conditionSearch:
          nullable: true
          description: >-
            Null when no conditionConceptIds were given. Unlike the breakdowns
            and filteredVariants, this is backed by real queries against
            cb_criteria, concept_ancestor and condition_occurrence.
          allOf:
            - $ref: "#/components/schemas/ConditionSearch"
        ancestryBreakdown:
          description: >-
            Mock data: there's no participant-level data source behind it yet,
            so the groups are made up, as are ageBreakdown and filteredVariants.
            The counts do sum to conditionSearch.participantCount, the real
            count, and percent is each count's share of it. Empty unless that
            count is above zero; groups that round to nobody are left out.
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSegment"
        ageBreakdown:
          description: Mock data, on the same participants as ancestryBreakdown.
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSegment"
        cohortVariants:
          type: array
          items:
            $ref: "#/components/schemas/CohortVariant"
        filteredVariants:
          description: >-
            Mock data (see ancestryBreakdown), one entry per cohortVariants
            entry and in the same order, generated for a cohort of
            conditionSearch.participantCount participants. Empty when
            ancestryBreakdown is.
          type: array
          items:
            $ref: "#/components/schemas/FilteredVariant"
    SearchSummary:
      type: object
      required:
        - variantsRaw
        - variantsEnteredCount
        - variantsLimit
      properties:
        variantsRaw:
          type: string
          description: The raw, newline-separated candidate variants as entered.
        variantsEnteredCount:
          type: integer
        variantsLimit:
          type: integer
    ConditionCandidates:
      type: object
      required:
        - term
        - candidates
      properties:
        term:
          type: string
          description: >-
            The term as entered, trimmed, echoed back so a type-ahead can
            discard responses that arrive out of order.
          example: "tetralogy of fallot"
        candidates:
          description: >-
            Matching condition concepts, best first: exact name match, then
            estimatedParticipantCount descending, with concepts that have no
            estimate last. Empty when nothing matched, or when the term was
            blank.
          type: array
          items:
            $ref: "#/components/schemas/ConditionConcept"
    ConditionSearch:
      type: object
      description: >-
        The phenotype filter a search was run with: the concepts that were
        asked for, the ones that resolved, and how many participants have any
        of them.
      required:
        - conceptIds
        - concepts
        - participantCount
        - conditionOverlap
      properties:
        conceptIds:
          type: array
          description: Every concept ID that was requested, in request order, without duplicates.
          items:
            type: integer
            format: int64
          example: [9000010, 9000040]
        concepts:
          type: array
          description: >-
            The requested concepts that are standard condition concepts in
            this CDR, in request order, each with its own participant count.
            An ID that isn't one is left out, so it can't contribute to the
            cohort. Empty when none resolved.
          items:
            $ref: "#/components/schemas/MatchedConcept"
        participantCount:
          type: integer
          nullable: true
          description: >-
            Distinct participants having ANY of the resolved concepts, or any
            of their descendants, recorded in condition_occurrence. A
            participant with more than one of them is counted once, so this
            is not the sum of the concepts' own counts. Null when concepts is
            empty. A real count, which will not match the concepts'
            estimatedParticipantCounts exactly.
          example: 260
        conditionOverlap:
          type: array
          description: >-
            How the matched participants divide among the resolved concepts:
            one cell per combination of concepts that at least one
            participant has (or a descendant of each). The cells are
            disjoint and their counts sum to participantCount; a concept's
            own participantCount is the sum of the cells that contain it.
            Unlike ancestryBreakdown and ageBreakdown this is a real count,
            from the same query as participantCount. Empty when concepts is.
          items:
            $ref: "#/components/schemas/ConditionOverlapCell"
    ConditionOverlapCell:
      type: object
      description: Participants recorded with exactly this set of the search's concepts.
      required:
        - conceptIds
        - count
      properties:
        conceptIds:
          type: array
          description: The concepts, in request order; one for participants with only that concept.
          items:
            type: integer
            format: int64
          example: [9000040, 9000060]
        count:
          type: integer
          example: 11
    MatchedConcept:
      type: object
      description: A ConditionConcept the search resolved, with its own real participant count.
      required:
        - conceptId
        - name
        - participantCount
      properties:
        conceptId:
          type: integer
          format: int64
          example: 9000010
        name:
          type: string
          example: "Tetralogy of Fallot"
        estimatedParticipantCount:
          type: integer
          nullable: true
          description: See ConditionConcept.estimatedParticipantCount.
          example: 47
        participantCount:
          type: integer
          description: >-
            Distinct participants having this concept or any of its
            descendants recorded in condition_occurrence. With several
            concepts, these overlap: see ConditionSearch.participantCount.
          example: 49
        hpo:
          nullable: true
          description: >-
            The HPO term paired with this concept, or null when none matched;
            see HpoTerm.
          allOf:
            - $ref: "#/components/schemas/HpoTerm"
    HpoTerm:
      type: object
      description: >-
        The Human Phenotype Ontology term VIA pairs with a condition concept,
        for display beside it. Matched on the concept's name against HPO term
        names and exact synonyms, inside the Phenotypic abnormality branch of
        the ontology; VIA has no cross-reference table, so this is a lexical
        pairing, not a curated mapping.
      required:
        - id
        - name
        - match
      properties:
        id:
          type: string
          example: "HP:0001636"
        name:
          type: string
          example: "Tetralogy of Fallot"
        match:
          type: string
          description: >-
            How the term was found. "exact": the concept's name is the term's
            name or one of its exact synonyms. "approximate": no term matched
            exactly, and this is the most specific term whose words all appear
            in the concept's name (e.g. "Hypercholesterolemia" for "Familial
            hypercholesterolemia"), so it is broader than the condition.
          enum: [exact, approximate]
          example: "exact"
    ConditionConcept:
      type: object
      required:
        - conceptId
        - name
      properties:
        conceptId:
          type: integer
          format: int64
          example: 9000010
        name:
          type: string
          example: "Tetralogy of Fallot"
        estimatedParticipantCount:
          type: integer
          nullable: true
          description: >-
            cb_criteria.est_count. An estimate, not a count -- it is what the
            ranking is based on, but participantCount is the real number. Null
            when the column was null or non-numeric; the real table also
            carries 0 and -1.
          example: 47
        hpo:
          nullable: true
          description: >-
            The HPO term paired with this concept, or null when none matched;
            see HpoTerm.
          allOf:
            - $ref: "#/components/schemas/HpoTerm"
    BreakdownSegment:
      type: object
      required:
        - label
        - count
        - percent
        - color
      properties:
        label:
          type: string
        count:
          type: integer
          description: Number of phenotype-matched participants in this segment.
        percent:
          type: number
        color:
          type: string
          description: Hex color used to render this segment.
          example: "#F9C854"
    CohortVariant:
      type: object
      required:
        - variant
        - annotated
      properties:
        variant:
          type: string
          example: "8-11708582-C-T"
        gene:
          type: string
          nullable: true
        annotated:
          type: boolean
          description: >-
            False when this variant is in no annotation or frequency source at
            all; every other field below is only meaningful when true.
        consequence:
          type: string
          nullable: true
          description: >-
            What the variant does to the protein (e.g. Missense, Frameshift).
          example: "Missense"
        proteinChange:
          type: string
          nullable: true
          example: "p.Arg115Cys"
        aouSubpopulation:
          type: string
          nullable: true
          enum: [EUR, AFR, AMR, EAS, SAS, MID, OTH]
        aouAf:
          type: number
          nullable: true
        aouAc:
          type: integer
          nullable: true
        aouAn:
          type: integer
          nullable: true
        aouPopulations:
          description: One entry per AoU subpopulation, for the expanded row's frequency table.
          type: array
          items:
            $ref: "#/components/schemas/PopulationFrequency"
        aouAllAf:
          type: number
          nullable: true
        aouAllAc:
          type: integer
          nullable: true
        aouAllAn:
          type: integer
          nullable: true
        gnomadSubpopulation:
          type: string
          nullable: true
          enum: [AFR, AMR, EAS, FIN, NFE, ASJ, OTH, SAS]
        gnomadAf:
          type: number
          nullable: true
        gnomadAc:
          type: integer
          nullable: true
        gnomadAn:
          type: integer
          nullable: true
        gnomadPopulations:
          description: One entry per gnomAD subpopulation, for the expanded row's frequency table.
          type: array
          items:
            $ref: "#/components/schemas/PopulationFrequency"
        gnomadAllAf:
          type: number
          nullable: true
        gnomadAllAc:
          type: integer
          nullable: true
        gnomadAllAn:
          type: integer
          nullable: true
        clinvarSignificance:
          type: string
          nullable: true
          enum: [Pathogenic, Likely pathogenic, VUS, Likely benign, Benign]
        clinvarStars:
          type: integer
          nullable: true
          minimum: 0
          maximum: 4
          description: >-
            ClinVar review status, as its 0-4 gold-star rating -- the max
            across this variant's RCV records. Null when there's no ClinVar
            record at all.
        clinvarHasConflicts:
          type: boolean
          description: >-
            True when this variant's own ClinVar RCV submissions disagree
            with each other. Meaningless when clinvarSignificance is null.
        clinvarConditions:
          type: array
          items:
            type: string
        clinvarLastUpdated:
          type: string
          format: date
          nullable: true
          description: >-
            When this variant's ClinVar record was last updated -- not necessarily the date its
            clinical significance was last evaluated, which the VAT doesn't separately provide.
        spliceAi:
          type: number
          nullable: true
        plof:
          type: string
          nullable: true
          description: >-
            LOFTEE's predicted loss-of-function call: "HC" (high confidence)
            or "LC" (low confidence). Null means either "not scored by
            LOFTEE" (when annotated) or n/a (when not annotated).
          enum: [HC, LC]
    FilteredVariant:
      type: object
      required:
        - variant
        - hasStats
      properties:
        variant:
          type: string
          example: "8-11708582-C-T"
        gene:
          type: string
          nullable: true
        consequence:
          type: string
          nullable: true
          description: >-
            As CohortVariant.consequence. Some variants have consequence annotation
            even when phenotype-filtered cohort stats don't exist yet.
        hasStats:
          type: boolean
          description: >-
            False when phenotype-filtered cohort stats aren't available --
            currently, when the variant has no cohort-wide All of Us
            frequency to derive them from. The numeric fields below are only
            meaningful when true.
        cohortAc:
          type: integer
          nullable: true
        cohortAn:
          type: integer
          nullable: true
        cohortAf:
          type: number
          nullable: true
        homozygotes:
          type: integer
          nullable: true
        heterozygotes:
          type: integer
          nullable: true
        clinvarPlpInTrans:
          type: integer
          nullable: true
        afRatio:
          type: number
          nullable: true
    PopulationFrequency:
      type: object
      required:
        - population
      properties:
        population:
          type: string
          example: "AFR"
        af:
          type: number
          nullable: true
        ac:
          type: integer
          nullable: true
        an:
          type: integer
          nullable: true
