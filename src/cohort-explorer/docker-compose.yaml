services:
  app:
    container_name: "application-server"
    build:
      context: .
    restart: always
    volumes:
      - .:/workspace:cached
      - work:/root:cached
    ports:
      - 8080:8080
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      AURORA_RESOURCE_ID: "${AURORA_RESOURCE_ID:-}"
      # Workspace resource the app saves cohorts into. Must be a controlled S3
      # storage folder in the workspace this app runs in, so it changes per
      # deployment. Keep the default in sync with main.py.
      COHORT_STORAGE_FOLDER_ID: "${COHORT_STORAGE_FOLDER_ID:-GTEx_files}"
      TSV_PATH: "${TSV_PATH:-/root/workspace/GTEx_demo_folder/GTEx_V8_sample_manifest_metadata.tsv}"

volumes:
  work:

networks:
  app-network:
    external: true
