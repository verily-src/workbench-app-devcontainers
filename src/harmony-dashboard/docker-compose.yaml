services:
  app:
    container_name: "application-server"
    image: "mcr.microsoft.com/devcontainers/base:ubuntu"
    command: sleep infinity
    restart: always
    ports:
      - "8502:8502"
    volumes:
      - /home/jupyter:/home/jupyter
    environment:
      GCS_BUCKET: "${templateOption:gcsBucket}"
      GCS_ROOT_PREFIX: "${templateOption:gcsRootPrefix}"
      HARMONY_DATASET_NAME: "${templateOption:datasetName}"
      HARMONY_DATASET_SUBTITLE: "${templateOption:datasetSubtitle}"
      HARMONY_GCS_PATH: ""
      HARMONY_LOCAL_PATH: "${templateOption:localPath}"
      HARMONY_PORT: "8502"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true