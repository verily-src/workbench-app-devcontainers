services:
  app:
    container_name: "application-server"
    image: "${templateOption:containerImage}"
    command: sleep infinity
    restart: always
    ports:
      - "8502:8502"
    volumes:
      - .:/app:cached
      - /home/jupyter:/home/jupyter
    environment:
      GCS_BUCKET: "${GCS_BUCKET:-mimic-iv-2-2-omop-staging-wb-smart-artichoke-3421}"
      GCS_ROOT_PREFIX: "${GCS_ROOT_PREFIX:-harmony}"
      HARMONY_DATASET_NAME: "${HARMONY_DATASET_NAME:-MIMIC-IV}"
      HARMONY_DATASET_SUBTITLE: "${HARMONY_DATASET_SUBTITLE:-MIMIC-IV 2.2}"
      HARMONY_GCS_PATH: "${HARMONY_GCS_PATH:-}"
      HARMONY_LOCAL_PATH: "${HARMONY_LOCAL_PATH:-}"
      HARMONY_PORT: "${HARMONY_PORT:-8502}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true
