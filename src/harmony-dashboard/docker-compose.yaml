services:
  app:
    container_name: "application-server"
    image: "${templateOption:containerImage}"
    command: sleep infinity
    restart: always
    ports:
      - "8502:8502"
    volumes:
      - .:/app:cached
      - /home/jupyter:/home/jupyter
    environment:
      GCS_BUCKET: "${GCS_BUCKET:-anschutz-pancreatic-cancer-ds-bucket-wb-golden-parsnip-6065}"
      GCS_ROOT_PREFIX: "${GCS_ROOT_PREFIX:-experimental/run_artifacts}"
      HARMONY_DATASET_NAME: "${HARMONY_DATASET_NAME:-WP1 Data}"
      HARMONY_DATASET_SUBTITLE: "${HARMONY_DATASET_SUBTITLE:-Pancreatic Cancer Dataset | Agentic FHIR Harmonization}"
      HARMONY_GCS_PATH: "${HARMONY_GCS_PATH:-}"
      HARMONY_LOCAL_PATH: "${HARMONY_LOCAL_PATH:-}"
      HARMONY_PORT: "${HARMONY_PORT:-8502}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true
