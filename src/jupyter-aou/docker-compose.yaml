include:
  - ../jupyter-common/jupyter-common-compose.yaml
  - ../aou-common/aou-common-compose.yaml
services:
  app:
    container_name: "application-server"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    build:
      context: .
      additional_contexts:
        jupyter-extension-builder: service:jupyter-common-extension-builder
        aou-extension-builder: service:aou-common-extension-builder
        load-envs: service:aou-common-load-envs
    user: "jupyter"
    restart: always
    volumes:
      - .:/workspace:cached
      - jupyter-home:/home/jupyter
    tmpfs:
      - /home/jupyter/workspace:uid=1001,gid=1001
    ports:
      - "8888:8888"
    networks:
      - app-network
    depends_on:
      - wondershaper
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    # TODO(PHP-87353): Add remotefuse back. See https://github.com/verily-src/workbench-app-devcontainers/pull/227
  wondershaper:
    container_name: "wondershaper"
    image: "us-west2-docker.pkg.dev/shared-pub-buckets-94mvrf/workbench-artifacts/app-wondershaper@sha256:6a19fddda747129e849ce452b358a28afea117915c5fbf7ba5e6106c5bd47201"
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
networks:
  app-network:
    external: true
volumes:
  jupyter-home:
