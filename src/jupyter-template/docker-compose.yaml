version: "2.4"
services:
  app:
    container_name: "application-server"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    image: "${templateOption:containerImage}"
    user: "jupyter"
    restart: always
    volumes:
      - .:/workspace:cached
      - jupyter-home:/home/jupyter
    tmpfs:
      - /home/jupyter/workspace:uid=1001,gid=1001
    ports:
      - "${templateOption:containerPort}:${templateOption:containerPort}"
    command: "/home/jupyter/.local/bin/jupyter lab"
    environment:
      SHELL: "/bin/bash"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
volumes:
  jupyter-home:
