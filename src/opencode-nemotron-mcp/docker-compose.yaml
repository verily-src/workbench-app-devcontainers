services:
  app:
    container_name: "application-server"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/workspace:cached
      - work:/config:cached
    ports:
      - "8443:8443"
    environment:
      USER: "abc"
      DEFAULT_WORKSPACE: "/config"
      SUDO_PASSWORD: "pwd"
      # Workbench only substitutes a fixed set of template options on the VM
      # (see startupscript/butane/050-parse-devcontainer.sh), so the model tag
      # is set here rather than as a template option.
      # Use "prompt" to defer the download until the first interactive opencode launch.
      # Auto selects Lightning on A100/H100, experimental Nano 4B on T4/V100.
      OLLAMA_MODEL: "auto"
      OLLAMA_HOST: "127.0.0.1:11434"
      # Default model store. To use a store on a bucket mount, write its path to
      # /config/.opencode-model-store instead; the path depends on the workspace.
      OLLAMA_MODELS: "/config/.ollama/models"
      # A store may be shared by several apps; never delete blobs on startup.
      OLLAMA_NOPRUNE: "true"
      # A cold 30B load from local disk takes about 13 minutes; Ollama's default is 5m.
      # validate-model.sh waits 25 minutes, so keep this value below that.
      OLLAMA_LOAD_TIMEOUT: "20m"
      # Single-user GPU: a cold reload costs minutes, so keep the active model warm.
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_FLASH_ATTENTION: "true"
      # Room for OpenCode, Workbench context, and MCP tool definitions.
      OLLAMA_CONTEXT_LENGTH: "65536"
      # Bound memory use on smaller GPUs, including when switching models.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true
volumes:
  work:
