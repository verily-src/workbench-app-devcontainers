# Default OpenShell policy for sandboxed OpenCode. Anything not listed is denied.
#
# On first start this file is copied to /config/openshell/policy.yaml, which
# persists across restarts. Edit that copy, then run `opencode-sandbox policy`.
# Network rules apply to the running sandbox within seconds. Filesystem and
# process rules apply only to a new sandbox: run `opencode-sandbox reset`.
#
# The data collections in the workspace can tighten this file (README, "Data
# collection policies"): a collection with openshell-internet=none removes every
# network rule here but local_models and the data rules. This file is never
# changed by that; policy.effective.yaml shows the result.
#
# Reference: https://docs.nvidia.com/openshell/latest/how-it-works/policies/schema
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /sbin, /usr, /lib, /lib64, /etc, /opt, /var/log, /proc, /dev/urandom, /dev/random]
  # /sandbox is the agent's home and workspace. /dev/tty is for OpenCode's
  # terminal interface.
  read_write: [/sandbox, /tmp, /dev/null, /dev/tty]

landlock:
  # Fail closed. Workbench's Flatcar 6.12 VMs provide Landlock ABI 6.
  compatibility: hard_requirement

network_policies:
  # The only way out: the local Nemotron models, through Ollama's
  # OpenAI-compatible chat API. Ollama's other endpoints, such as /api/pull and
  # /api/push, reach model registries on the internet and stay blocked.
  local_models:
    name: local_models
    endpoints:
      - host: host.openshell.internal
        port: 11434
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
          - allow: {method: GET, path: /v1/models}
    # render-policy.py replaces this list with the harness's binaries (harness.yaml)
    # plus curl. curl can reach the same two endpoints; that adds nothing the agent
    # couldn't already do through its harness, and lets the self-test check the
    # path rules. Processes a listed program starts are covered too.
    binaries:
      - path: /usr/bin/curl

  # To allow another destination, add a rule here. For example, package
  # downloads from PyPI for `pip install` (pip runs on the Python interpreter):
  #
  # pypi:
  #   name: pypi
  #   endpoints:
  #     - host: pypi.org
  #       port: 443
  #       protocol: rest
  #       enforcement: enforce
  #       access: read-only
  #     - host: files.pythonhosted.org
  #       port: 443
  #       protocol: rest
  #       enforcement: enforce
  #       access: read-only
  #   binaries:
  #     - path: /usr/bin/python3.11
