services:
  app:
    container_name: "application-server"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/workspace:cached
      - work:/config:cached
    ports:
      - "8443:8443"
    environment:
      USER: "abc"
      DEFAULT_WORKSPACE: "/config"
      SUDO_PASSWORD: "pwd"
      # Workbench only substitutes a fixed set of template options on the VM
      # (see startupscript/butane/050-parse-devcontainer.sh), so the model tag
      # is set here rather than as a template option.
      # Use "prompt" to defer the download until the first interactive opencode launch.
      OLLAMA_MODEL: "nemotron-3-nano:4b"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "/config/.ollama/models"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "true"
      # Room for OpenCode, Workbench context, and MCP tool definitions.
      OLLAMA_CONTEXT_LENGTH: "65536"
      # Bound memory use on smaller GPUs, including when switching models.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true
volumes:
  work:
