include:
  - ../jupyter-common/jupyter-common-compose.yaml
services:
  # Browser front end, built from the shared ../browser-common image (Selkies + policy baked in).
  app:
    container_name: "application-server"
    build:
      context: ../browser-common
      args:
        APP_ORIGIN: "jupyterlab:8888"
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      CHROME_CLI: "--app=http://jupyterlab:8888"

  jupyterlab:
    container_name: "jupyterlab"
    build:
      context: .
      additional_contexts:
        jupyter-extension-builder: service:jupyter-common-extension-builder
    user: "jupyter"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    restart: always
    volumes:
      - .:/workspace:cached
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
