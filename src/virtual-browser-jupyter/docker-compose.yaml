include:
  - ../jupyter-common/jupyter-common-compose.yaml
services:
  # The browser is the served app: the proxy agent resolves its target by inspecting the container
  # named "application-server" and taking its first published host port.
  app:
    container_name: "application-server"
    build:
      context: .
      dockerfile: ./browser.Dockerfile
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      SELKIES_DESKTOP: false
      NO_GAMEPAD: true
      NO_DECOR: true
      HARDEN_DESKTOP: true
      DISABLE_CLOSE_BUTTON: true
      RESTART_APP: true
      HARDEN_KEYBINDS: true
      SELKIES_UI_TITLE: VWB
      SELKIES_UI_SHOW_LOGO: false
      SELKIES_UI_SIDEBAR_SHOW_STATS: false
      SELKIES_ENABLE_SHARING: false
      SELKIES_CLIPBOARD_OUT_ENABLED: false
      SELKIES_FILE_TRANSFERS: upload
      SELKIES_UI_SIDEBAR_SHOW_FILES: true
      SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE: false
      SELKIES_UI_SHOW_CORE_BUTTONS: false
      # Chromium runs as a single-window app with no tab strip or address bar. The app URL must
      # match the URLAllowlist entry in policies/managed-policy.json.
      CHROME_CLI: "--app=http://jupyterlab:8888 --force-app-mode --start-fullscreen --proxy-server=0.0.0.0:0 --proxy-bypass-list=jupyterlab"

  # JupyterLab is reached only over app-network by the browser container, so it publishes no ports.
  jupyterlab:
    container_name: "jupyterlab"
    build:
      context: .
      additional_contexts:
        jupyter-extension-builder: service:jupyter-common-extension-builder
    user: "jupyter"
    restart: always
    volumes:
      - .:/workspace:cached
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
