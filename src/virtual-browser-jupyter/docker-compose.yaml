services:
  # Keep the browser container across backend recreation.
  app:
    # Proxy startup and readiness checks require this container name.
    container_name: "application-server"
    image: workbench-virtual-browser:app
    pull_policy: never
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
      - backend-network
    environment:
      CHROME_CLI: "--kiosk http://jupyterlab:8888"
      FILE_MANAGER_PATH: /uploads
      # Run the browser as the backend's user so uploaded files are writable there, not just readable.
      PUID: 1001
      PGID: 1001
    # Shared with the backend so uploads from the streamed browser land in its file browser.
    volumes:
      - browser-uploads:/uploads

  jupyterlab:
    container_name: "jupyterlab"
    image: workbench-local-snapshot:devcontainer
    pull_policy: never
    user: "jupyter"
    # Hardware template options belong only to the backend.
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    restart: always
    volumes:
      - .:/workspace:cached
      - jupyter-home:/home/jupyter
      - ${WORKBENCH_SETUP_STATE_DIR:-/home/core/container-state.d/setup}:/var/lib/workbench/setup:ro
      - browser-uploads:/home/jupyter/browser-uploads
    networks:
      - backend-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
  backend-network:
volumes:
  # A host bind mount through the local driver lets Docker seed the image's home files.
  jupyter-home:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/core/container-state.d/jupyter-home
  browser-uploads:
