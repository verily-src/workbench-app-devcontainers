include:
  - ../jupyter-common/jupyter-common-compose.yaml
services:
  # Browser front end. Built from the shared ../browser-common image; this template supplies only
  # the JupyterLab-specific values. Selkies + hardening defaults are baked into that image.
  app:
    container_name: "application-server"
    build:
      context: ../browser-common
      dockerfile: browser.Dockerfile
      args:
        APP_ORIGIN: "jupyterlab:8888"
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      # --kiosk: fullscreen, no window chrome/decorations, no address bar.
      CHROME_CLI: "--kiosk http://jupyterlab:8888"

  # JupyterLab server. Reached only over app-network by the browser container, so it publishes no ports.
  jupyterlab:
    container_name: "jupyterlab"
    build:
      context: .
      additional_contexts:
        jupyter-extension-builder: service:jupyter-common-extension-builder
    user: "jupyter"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    restart: always
    volumes:
      - .:/workspace:cached
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
