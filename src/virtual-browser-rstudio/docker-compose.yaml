services:
  # Browser front end, built from the shared ../browser-common image (Selkies + policy baked in).
  app:
    container_name: "application-server"
    build:
      context: ../browser-common
      args:
        APP_ORIGIN: "rstudio:8787"
    # Chromium needs real shared memory to render; the 64MB Docker default causes renderer crashes.
    shm_size: "2gb"
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
      - backend-network
    environment:
      CHROME_CLI: "--app=http://rstudio:8787"
      FILE_MANAGER_PATH: /uploads
      # Run the browser as the backend's user so uploaded files are writable there, not just readable.
      PUID: 1000
      PGID: 1000
    # Shared with the backend so uploads from the streamed browser land in its file browser.
    volumes:
      - browser-uploads:/uploads

  rstudio:
    container_name: "rstudio"
    image: "ghcr.io/rocker-org/devcontainer/tidyverse@sha256:3a9ecbed900f17da528cdb17c3ddc43045fc9b4be7dbd8c61cb7b8a6439bfa6b"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    restart: always
    volumes:
      - .:/workspace:cached
      - work:/home/rstudio:cached
      - browser-uploads:/home/rstudio/browser-uploads
    tmpfs:
      - /home/rstudio/workspace:uid=1000,gid=1000
    environment:
      DISABLE_AUTH: "true"
    networks:
      - backend-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
  backend-network:
volumes:
  work:
  browser-uploads:
