services:
  # Keep the browser container across backend recreation.
  browser:
    container_name: "browser"
    labels:
      com.verily.workbench.proxy-target: "true"
    image: workbench-virtual-browser:app
    pull_policy: never
    # Chromium needs real shared memory to render; the 64MB Docker default causes renderer crashes.
    shm_size: "2gb"
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
      - backend-network
    environment:
      # The hostname "app" is HSTS-preloaded in Chromium and forces HTTPS.
      CHROME_CLI: "--kiosk http://application-server:8787"
      FILE_MANAGER_PATH: /uploads
      # Run the browser as the backend's user so uploaded files are writable there, not just readable.
      PUID: 1000
      PGID: 1000
    # Shared with the backend so uploads from the streamed browser land in its file browser.
    volumes:
      - browser-uploads:/uploads

  app:
    container_name: "application-server"
    image: workbench-local-snapshot:devcontainer
    pull_policy: never
    # Hardware template options belong only to the backend.
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    restart: always
    volumes:
      - .:/workspace:cached
      - ${WORKBENCH_SETUP_STATE_DIR:-/home/core/container-state.d/setup}:/var/lib/workbench/setup:ro
      - work:/home/rstudio:cached
      - browser-uploads:/home/rstudio/browser-uploads
    tmpfs:
      - /home/rstudio/workspace:uid=1000,gid=1000
    environment:
      DISABLE_AUTH: "true"
    networks:
      - backend-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
  backend-network:
volumes:
  work:
  browser-uploads:
