[server]
headless = true
# The page is served through the Workbench proxy, so the browser's origin is
# the Workbench host. Streamlit refuses the page's live connection from any
# origin that is not listed here.
corsAllowedOrigins = ["https://workbench.verily.com"]
# Serves the font files in static/ alongside the app.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Hides Streamlit's "Deploy" button and developer menu.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#087A6A"
backgroundColor = "#F2EFE8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2A2A2A"
borderColor = "#D3D0C8"
font = "Inter, Arial, sans-serif"
headingFont = "Poppins, Arial, sans-serif"
headingFontWeights = 300
baseRadius = "0.5rem"
buttonRadius = "full"

[[theme.fontFaces]]
family = "Poppins"
url = "app/static/fonts/poppins-300.woff2"
weight = "300"
style = "normal"

[[theme.fontFaces]]
family = "Poppins"
url = "app/static/fonts/poppins-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-500.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-600.woff2"
weight = "600"
style = "normal"
