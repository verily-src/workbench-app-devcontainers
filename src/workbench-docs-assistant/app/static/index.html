<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench Docs Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  /* Tokens from style-guide/verily-workbench-style-guide.html */
  :root {
    --primary-teal: #087a6a; --dark-teal: #074D43; --hover-teal: #054f45; --lighter-teal: #84bdb5;
    --light-gray-bg: #F5F6F7; --white: #fff; --dark-bg: #1A1A1A; --border-gray: #dee2e6;
    --primary-text: #212529; --secondary-text: rgba(0,0,0,.6); --footer-text: #B1B9C2;
    --font-body: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --font-hero: "Poppins", sans-serif;
    --radius: .375rem; --radius-xl: 1rem; --shadow-sm: 0 .125rem .25rem rgba(0,0,0,.075);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font-body); color: var(--primary-text); background: var(--white); display: flex; flex-direction: column; }
  .navbar { background: var(--primary-teal); color: var(--white); padding: .6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .navbar h1 { font-family: var(--font-hero); font-weight: 500; font-size: 1.15rem; margin: 0; }
  .navbar a { color: var(--white); }
  .status { font-size: .8rem; display: flex; align-items: center; gap: .5rem; white-space: nowrap; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #f0ad4e; display: inline-block; }
  .dot.ready { background: #7ee2c9; } .dot.error { background: #e06666; }
  main { flex: 1; overflow-y: auto; padding: 1.5rem 1rem; }
  .thread { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .msg { padding: .9rem 1.1rem; border-radius: var(--radius-xl); line-height: 1.55; max-width: 92%; }
  .msg.user { background: var(--dark-teal); color: var(--white); align-self: flex-end; white-space: pre-wrap; }
  .msg.assistant { background: var(--light-gray-bg); align-self: flex-start; }
  .msg.assistant p:first-child { margin-top: 0; } .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant pre { background: var(--white); border: 1px solid var(--border-gray); border-radius: var(--radius); padding: .6rem .8rem; overflow-x: auto; font-size: .85rem; }
  .msg.assistant code { font-size: .9em; } .msg.assistant p code, .msg.assistant li code { background: var(--white); padding: .05rem .3rem; border-radius: .2rem; border: 1px solid var(--border-gray); }
  .msg.assistant a { color: var(--primary-teal); }
  a.cite { display: inline-block; font-size: .7rem; font-weight: 700; line-height: 1; padding: .15rem .35rem; margin-left: .15rem; vertical-align: super; background: var(--primary-teal); color: var(--white) !important; border-radius: .6rem; text-decoration: none; }
  a.cite:hover { background: var(--hover-teal); }
  .sources { margin-top: .75rem; padding-top: .6rem; border-top: 1px solid var(--border-gray); font-size: .85rem; }
  .sources .label { color: var(--secondary-text); font-weight: 600; margin-bottom: .25rem; }
  .sources ol { margin: 0; padding-left: 1.3rem; } .sources li { margin: .15rem 0; }
  .msg.error { background: #fdecea; color: #7f1d1d; align-self: flex-start; }
  .thinking span { display: inline-block; width: .45rem; height: .45rem; margin-right: .25rem; background: var(--lighter-teal); border-radius: 50%; animation: b 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: .2s; } .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { border: 1px solid var(--primary-teal); color: var(--primary-teal); background: var(--white); border-radius: 2rem; padding: .35rem .8rem; font-size: .85rem; cursor: pointer; font-family: inherit; }
  .chip:hover { background: var(--primary-teal); color: var(--white); }
  .welcome h2 { font-family: var(--font-hero); font-weight: 500; font-size: 1.35rem; margin: 0 0 .4rem; }
  .welcome p { margin: 0 0 .8rem; color: var(--secondary-text); }
  form { border-top: 1px solid var(--border-gray); padding: .8rem 1rem; background: var(--white); }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: .6rem; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; font-size: .95rem; padding: .7rem .9rem; border: 1px solid var(--border-gray); border-radius: var(--radius); min-height: 2.9rem; max-height: 9rem; }
  textarea:focus { outline: none; border-color: var(--lighter-teal); box-shadow: 0 0 0 3px rgba(8,122,106,.15); }
  button.send { font: inherit; font-weight: 600; background: var(--primary-teal); color: var(--white); border: none; border-radius: var(--radius); padding: .75rem 1.2rem; cursor: pointer; }
  button.send:hover { background: var(--hover-teal); } button.send:disabled { opacity: .5; cursor: default; }
  .footer { background: var(--dark-bg); color: var(--footer-text); font-size: .78rem; padding: .6rem 1.5rem; text-align: center; }
  .footer a { color: var(--white); }
</style>
</head>
<body>
<header class="navbar">
  <h1 id="title">Workbench Docs Assistant</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">Connecting…</span></div>
</header>

<main id="main">
  <div class="thread" id="thread">
    <div class="msg assistant welcome" id="welcome">
      <h2>Ask about Verily Workbench</h2>
      <p>Answers come from the official documentation, with links to the pages used. Try one of these:</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</main>

<form id="form">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </div>
</form>

<footer class="footer" id="footer">Documentation: <a id="docs-link" href="https://support.workbench.verily.com" target="_blank" rel="noopener">support.workbench.verily.com</a></footer>

<script>
  // Workbench serves apps behind a proxy path (…/app/<id>/proxy/8080/), so build API URLs from the
  // current location rather than from the site root.
  const BASE = location.pathname.replace(/index\.html$/, "").replace(/\/?$/, "/");
  const api = (path) => BASE + "api/" + path;

  const STARTERS = [
    "How do I create a JupyterLab app?",
    "How do I add a Cloud Storage bucket to my workspace?",
    "How do I share a workspace with a collaborator?",
    "How do I run a Nextflow workflow?",
    "How do I add a data collection to my workspace?",
    "What does wb resource add-ref do?",
  ];
  const thread = document.getElementById("thread"), input = document.getElementById("input"),
        send = document.getElementById("send"), main = document.getElementById("main");
  const history = [];
  let busy = false, contactsShown = false;

  for (const q of STARTERS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = q;
    b.onclick = () => ask(q); document.getElementById("chips").appendChild(b);
  }

  async function refreshStatus() {
    try {
      const r = await fetch(api("status")); const s = await r.json();
      document.title = s.title; document.getElementById("title").textContent = s.title;
      document.getElementById("docs-link").href = s.docs_base_url;
      document.getElementById("docs-link").textContent = s.docs_base_url.replace(/^https?:\/\//, "");
      if (s.support_contacts && !contactsShown) {
        contactsShown = true;
        document.getElementById("footer").insertAdjacentHTML("beforeend", " · Need more help? " + escapeHtml(s.support_contacts));
      }
      const idx = s.index, dot = document.getElementById("dot"), txt = document.getElementById("status-text");
      if (idx.state === "ready") {
        dot.className = "dot ready";
        txt.textContent = `Ready · ${idx.pages} pages · ${s.model}` + (idx.embeddings === "ok" ? "" : " · keyword search only");
        txt.title = idx.embeddings === "ok" ? "" : "Embeddings: " + idx.embeddings;
      } else if (idx.state === "indexing") {
        dot.className = "dot"; txt.textContent = "Indexing documentation… " + (idx.progress || ""); setTimeout(refreshStatus, 3000);
      } else {
        dot.className = "dot error"; txt.textContent = idx.error || "Index not available"; txt.title = idx.error || ""; setTimeout(refreshStatus, 10000);
      }
      return true;
    } catch (e) {
      document.getElementById("status-text").textContent = "Cannot reach the app"; setTimeout(refreshStatus, 5000);
    }
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function addMessage(cls, html) {
    const div = document.createElement("div"); div.className = "msg " + cls; div.innerHTML = html;
    thread.appendChild(div); main.scrollTop = main.scrollHeight; return div;
  }

  async function ask(question) {
    question = question.trim(); if (!question || busy) return;
    busy = true; send.disabled = true; input.value = ""; input.style.height = "";
    document.getElementById("welcome")?.remove();
    addMessage("user", escapeHtml(question));
    history.push({ role: "user", content: question });
    const pending = addMessage("assistant thinking", "<span></span><span></span><span></span>");
    try {
      const r = await fetch(api("chat"), { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ messages: history.slice(-9) }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      let html = data.answer_html;
      const list = data.sources.length ? data.sources : data.related;
      if (list.length) {
        html += `<div class="sources"><div class="label">${data.sources.length ? "Sources" : "Related pages"}</div><ol>` +
          list.map(s => `<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}${s.heading ? " › " + escapeHtml(s.heading) : ""}</a></li>`).join("") + "</ol></div>";
      }
      pending.className = "msg assistant"; pending.innerHTML = html;
      history.push({ role: "assistant", content: data.answer_markdown });
    } catch (e) {
      pending.className = "msg error"; pending.textContent = "Sorry, that didn't work: " + e.message;
      history.pop();
    } finally {
      busy = false; send.disabled = false; input.focus(); main.scrollTop = main.scrollHeight;
    }
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
  input.addEventListener("input", () => { input.style.height = ""; input.style.height = Math.min(input.scrollHeight, 144) + "px"; });
  refreshStatus();
</script>
</body>
</html>
