services:
  app:
    # The container name must be "application-server"
    container_name: "application-server"
    build:
      context: ./app
    restart: always
    # Configuration is optional. Defaults are built into the app; set per-instance
    # overrides as VM metadata (wb app create gcp -M support-contacts=...), or
    # uncomment and edit the environment block on a fork.
    # environment:
    #   DOCS_BASE_URL: "https://support.workbench.verily.com"
    #   GEMINI_MODEL: "gemini-3.5-flash"
    #   VERTEX_LOCATION: "global"
    #   ASSISTANT_TITLE: "Workbench Docs Assistant"
    #   SUPPORT_CONTACTS: "Email workbench-support@verily.com"
    volumes:
      # Cached documentation index, so restarts don't re-crawl the site.
      - index-cache:/data
    ports:
      - 8080:8080
    networks:
      - app-network

volumes:
  index-cache:

networks:
  # The Docker network must be named "app-network". This is an external network
  # that is created outside of this docker-compose file.
  app-network:
    external: true
