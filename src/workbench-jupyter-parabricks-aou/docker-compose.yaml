include:
  - ../aou-common/aou-common-compose.yaml
services:
  app:
    container_name: "application-server"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    build:
      context: ../workbench-jupyter-parabricks
      additional_contexts:
        extension-builder: service:aou-common-extension-builder
        load-envs: service:aou-common-load-envs
      target: parabricks-aou
    user: jupyter
    restart: always
    volumes:
      - .:/workspace:cached
      - jupyter-home:/home/jupyter
    tmpfs:
      - /home/jupyter/workspace:uid=1010,gid=1000
    ports:
      - "8888:8888"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--LabApp.token=''"]
  wondershaper:
    container_name: "wondershaper"
    image: "us-west2-docker.pkg.dev/shared-pub-buckets-94mvrf/workbench-artifacts/app-wondershaper@sha256:94cd86fa5990e9eefa848db835c99cbec737ed12e0083006cf0cc9aeb0db43ed"
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
networks:
  app-network:
    external: true
volumes:
  jupyter-home:
