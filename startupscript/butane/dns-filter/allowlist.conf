# PHP-194237: interim, hand-maintained allowlist. Per the design doc, this is meant to be
# generated at image-build time from the verily-aws-workbench-modules dns-firewall module's
# Terraform output (`terraform output -json domain_allowlist`), not hand-copied - that generation
# step does not exist yet. Replace this file once it does.
no-resolv
listen-address=172.17.0.1
bind-interfaces
server=/s3.us-east-1.amazonaws.com/169.254.169.253
server=/ecr.us-east-1.amazonaws.com/169.254.169.253
server=/dkr.ecr.us-east-1.amazonaws.com/169.254.169.253
server=/codeartifact.us-east-1.amazonaws.com/169.254.169.253
server=/d.codeartifact.us-east-1.amazonaws.com/169.254.169.253
server=/ec2.us-east-1.amazonaws.com/169.254.169.253
server=/logs.us-east-1.amazonaws.com/169.254.169.253
server=/ssm.us-east-1.amazonaws.com/169.254.169.253
server=/ssmmessages.us-east-1.amazonaws.com/169.254.169.253
# Required for the VM's own boot/status scripts (service-utils.sh get_service_url) to keep
# reaching WSM/ECM for CLI auth, secret provisioning, and status reporting - confirmed via
# probe-proxy-readiness.sh, docker-credential-secrets.sh, 035-register-key.sh,
# 055-provide-secrets.sh, and 040-git-clone-devcontainer.sh all calling this domain.
server=/workbench.verily.com/169.254.169.253
address=/#/
